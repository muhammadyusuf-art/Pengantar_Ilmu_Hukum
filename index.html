<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengantar Ilmu Hukum - Struktur Pengadilan Pidana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="container">
            <span class="badge">Pengantar Ilmu Hukum • Semester 1</span>
            <h1>Struktur & Aktor dalam Pengadilan Pidana</h1>
            <p>Pelajari peran, kedudukan, dan dasar hukum para pihak di ruang sidang secara bertahap.</p>
        </div>
    </header>

    <main class="container">
        <!-- Navigasi Tahapan -->
        <nav class="stepper" id="stepper-nav">
            <!-- Tombol tahap akan di-generate oleh JavaScript -->
        </nav>

        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <!-- Area Konten Utama -->
        <section class="card content-area" id="content-area">
            <!-- Materi dinamis akan tampil di sini -->
        </section>

        <!-- Tombol Navigasi Bawah -->
        <div class="nav-controls" id="nav-controls">
            <button id="btn-prev" class="btn btn-secondary" disabled>← Sebelumnya</button>
            <span id="step-indicator" class="step-text">Tahap 1 dari 7</span>
            <button id="btn-next" class="btn btn-primary">Selanjutnya →</button>
        </div>
    </main>

    <footer class="app-footer">
        <p>Media Pembelajaran Interaktif — Mata Kuliah Pengantar Ilmu Hukum (Berbasis KUHAP)</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
